name: Server

on:
  push:
    branches: ['main']
    paths:
      - 'apps/server/**'
      - 'apps/site/**'
      - 'apps/studio/**'
      - 'apps/web/embed.html'
      - 'apps/web/vite.embed.config.ts'
      - 'apps/web/src/**'
      - 'packages/**'
      - 'scripts/build-server-web.sh'
      - 'package-lock.json'
      - '.github/workflows/server.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'apps/server/**'
      - 'apps/site/**'
      - 'apps/studio/**'
      - 'apps/web/embed.html'
      - 'apps/web/vite.embed.config.ts'
      - 'apps/web/src/**'
      - 'packages/**'
      - 'scripts/build-server-web.sh'
      - 'package-lock.json'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # The server embeds apps/server/web/dist at compile time (RustEmbed), so the
      # site and embed build has to exist before cargo runs.
      - name: Build embedded web assets (site, studio, embed player)
        run: scripts/build-server-web.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/server

      - name: cargo check
        working-directory: apps/server
        run: cargo check --locked --all-targets

      - name: cargo test
        working-directory: apps/server
        run: cargo test --locked
