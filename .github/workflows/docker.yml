name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_TAILNET_HOST: ${{ secrets.COOLIFY_TAILNET_HOST }}

    steps:
      - name: Join Tailnet as tag:ci
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy nostube-web
        run: |
          curl --fail --show-error --connect-timeout 10 \
            "http://${COOLIFY_TAILNET_HOST}:8000/api/v1/health"
          curl --fail --show-error --request POST \
            "http://${COOLIFY_TAILNET_HOST}:8000/api/v1/deploy?uuid=gw7r9tyk7dqhlb3wh9fjvdh3" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}"
