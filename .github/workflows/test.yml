name: Test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check core, widgets, site and studio (lint, typecheck, test)
        run: |
          npm run lint --workspace @nostube/core --workspace @nostube/widgets --workspace @nostube/site --workspace @nostube/studio
          npm run typecheck --workspace @nostube/core --workspace @nostube/widgets --workspace @nostube/site --workspace @nostube/studio
          npm run test --workspace @nostube/core --workspace @nostube/widgets --workspace @nostube/site --workspace @nostube/studio

      - name: Build site and studio
        run: |
          npm run build --workspace @nostube/site
          npm run build --workspace @nostube/studio

      - name: Run tests
        working-directory: apps/web
        run: npm run test
